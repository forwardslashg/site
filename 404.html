<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>404 | Slash's Site</title>
	<meta name="robots" content="noindex">
	<meta name="theme-color" content="#101510">
	<meta name="color-scheme" content="light dark">
	<script>
	{
		const colorScheme = localStorage.getItem("color-scheme");
		if (colorScheme) {
			document.querySelector('meta[name="color-scheme"]').content = colorScheme;
		}
	}
	</script>
	<link rel="stylesheet" href="styles.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<style>
		.not-found {
			width: min(680px, 92vw);
			margin-block: auto;
			display: flex;
			flex-direction: column;
			align-items: flex-start;
			gap: 0.9rem;
		}
	</style>
</head>
<body>
	<main class="not-found">
		<p class="label">404</p>
		<h1 class="name">page not found</h1>
		<p class="body-copy">
			The page you are looking for does not exist, was moved, or never existed.
		</p>
		<p class="body-copy">
			<a class="inline-link" href="/">
				Go to homepage
				<i class="bi bi-arrow-right external-icon" aria-hidden="true"></i>
			</a>
		</p>
	</main>
</body>
</html>
