<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>404 | slash site</title>
	<link rel="stylesheet" href="styles.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
	<style>
		.site {
			grid-template-columns: 1fr;
		}
	</style>

	<main class="site">
		<section class="right-pane" aria-label="404 message">
			<div class="panels">
				<article class="panel active" role="region" aria-label="Not found">
					<h2 class="section-title">404 - page not found</h2>
					<p class="lead">
						The page you are looking for does not exist, was moved, or never existed.
					</p>
					<p class="about-copy">
						Use the button below to return to the main page.
					</p>
					<p>
						<a class="boxed-external-link" href="/">
							Go to homepage
							<i class="bi bi-arrow-right" aria-hidden="true"></i>
						</a>
					</p>
				</article>
			</div>
		</section>
	</main>
</body>
</html>
